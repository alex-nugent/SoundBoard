; ============================================================================
; SoundBoard V4 — product firmware (spec/v4/FirmwareSpec.md §19.6)
; Unexpected Maker ProS3 (ESP32-S3-WROOM-1, N16R8: 16 MB flash / 8 MB PSRAM)
;
; Toolchain facts the design relies on are in FirmwareSpec.md §2.6; the pin
; map and hardware rules are in briefs/FirmwareBrief.md. Never add
; `lib_ignore` (rule 16 of §2.3): the screen driver is vendored in lib/.
; ============================================================================
[platformio]
default_envs = pros3

[env:pros3]
; pioarduino fork, pinned: arduino-esp32 core 3.3.0 (the S3 touch driver,
; NimBLE, IDF 5.x). The stock espressif32 platform ships core 2.0.17.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-1/platform-espressif32.zip
board    = um_pros3
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
monitor_echo  = yes
monitor_filters = esp32_exception_decoder

; Native USB CDC (the ProS3 has no UART chip); ArduinoJson comments allowed
; in config.json (§13.1 rule 6); core log level: errors only.
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINOJSON_ENABLE_COMMENTS=1
	-DCORE_DEBUG_LEVEL=1

lib_deps =
	adafruit/Adafruit GFX Library
	bblanchon/ArduinoJson @ ^7.4

; FW_VERSION from `git describe --tags --dirty --always` (§16, §19.11).
extra_scripts = pre:tools/version.py, pre:tools/build_page.py

board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

; ----------------------------------------------------------------------------
; Host unit tests (§19.10): lib/sbcore + test/, no src/.
; ----------------------------------------------------------------------------
[env:native]
platform = native
test_build_src = no
build_flags =
	-std=gnu++17
	-DNATIVE_TEST
	-DARDUINOJSON_ENABLE_COMMENTS=1
lib_deps =
	bblanchon/ArduinoJson @ ^7.4
